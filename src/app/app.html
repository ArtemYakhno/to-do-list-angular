<main class="task-page">

  <header class="task-page__header">
    <h1 class="task-page__title">Список справ</h1>
  </header>

  <div class="task-form">
    <input
      class="task-form__input"
      [(ngModel)]="newTitle"
      placeholder="Нове завдання..."
      (keyup.enter)="add()"
    />
    <select class="task-form__select" [(ngModel)]="newPriority">
      @for (p of priorityOptions; track p.value) {
        <option [value]="p.value">{{ p.label }}</option>
      }
    </select>
    <button class="task-form__btn" (click)="add()">+ Додати</button>
  </div>

  <div class="task-controls">
    <div class="task-controls__filters">
      @for (f of filterOptions; track f.value) {
        <button
          class="task-controls__filter-btn"
          [class.task-controls__filter-btn--active]="taskService.filterMode() === f.value"
          (click)="taskService.setFilter(f.value)"
        >
          {{ f.label }}
        </button>
      }
    </div>
    <select class="task-controls__sort" (change)="onSortChange($event)">
      @for (s of sortOptions; track s.value) {
        <option [value]="s.value">{{ s.label }}</option>
      }
    </select>
  </div>

  <ul class="task-list">
    @for (task of taskService.filteredTasks(); track task.id) {
      <li class="task-list__item">
        <app-task-item
          [task]="task"
          (toggle)="taskService.toggleTask($event)"
          (delete)="taskService.deleteTask($event)"
          (edit)="taskService.updateTitle($event.id, $event.title)"
        />
      </li>
    } @empty {
      <li class="task-list__empty">Немає завдань 🎉</li>
    }
  </ul>

</main>
